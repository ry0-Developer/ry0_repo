name: 🚀 Add New App to Repo
description: Smart dashboard to automatically add an app to repo.json and generate its workflow.
title: "[ADD APP] "
labels: ["auto-add"]
body:
  - type: input
    id: app_name
    attributes:
      label: Local App Name
      description: The name you want to show in YOUR repo (e.g., YouTube Lite).
    validations:
      required: true

  - type: dropdown
    id: source_type
    attributes:
      label: Source Type
      description: Where is this app coming from?
      options:
        - "Another Repo JSON (Auto-fill details)"
        - "GitHub Release (Standard App)"
    validations:
      required: true

  - type: input
    id: source_url
    attributes:
      label: Source URL
      description: URL to the Repo JSON (e.g., https://repo.ballermc.com/repo.json) OR GitHub Repo (e.g., LiveContainer/LiveContainer)
    validations:
      required: true

  - type: input
    id: external_app_name
    attributes:
      label: Target App Name (Only for 'Another Repo JSON')
      description: What is the exact name of the app in THEIR json? (e.g., YTLite). 
    validations:
      required: false

  - type: textarea
    id: icon_upload
    attributes:
      label: App Icon
      description: Drag and drop the app icon here! (Or leave blank to use the icon from the external repo if available).
    validations:
      required: false

  - type: markdown
    attributes:
      value: "--- \n **👇 OPTIONAL DETAILS (Fill these ONLY if using 'GitHub Release')**"

  - type: input
    id: bundle_id
    attributes:
      label: Bundle Identifier
    validations:
      required: false

  - type: input
    id: developer
    attributes:
      label: Developer Name
    validations:
      required: false

  - type: input
    id: description
    attributes:
      label: Description
    validations:
      required: false

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - utilities
        - games
        - emulators
        - entertainment
        - social
    validations:
      required: false
