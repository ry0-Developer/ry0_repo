name: 🚀 Add New App to Repo
description: Smart dashboard to automatically add an app to repo.json and generate its workflow.
title: "[ADD APP] "
labels: ["auto-add"]
body:
  - type: input
    id: app_name
    attributes:
      label: App Name
      description: The exact name of the application (e.g., YouTube Lite).
    validations:
      required: true

  - type: input
    id: bundle_id
    attributes:
      label: Bundle Identifier
      description: e.g., com.google.ios.youtube
    validations:
      required: true

  - type: input
    id: developer
    attributes:
      label: Developer Name
      description: e.g., Google / Tweaked
    validations:
      required: true

  - type: input
    id: description
    attributes:
      label: Description
      description: Short description of the app.
    validations:
      required: true

  - type: input
    id: icon_name
    attributes:
      label: Icon Filename
      description: Make sure you uploaded it to the icons folder! (e.g., youtube-icon.png)
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - utilities
        - games
        - emulators
        - entertainment
        - social
    validations:
      required: true

  - type: dropdown
    id: source_type
    attributes:
      label: How should the bot fetch updates?
      description: Choose the logic for the auto-update workflow.
      options:
        - "GitHub Release (Standard App)"
        - "Another Repo JSON (e.g., BallerMC - No IPA download)"
    validations:
      required: true

  - type: input
    id: source_url
    attributes:
      label: Source URL
      description: If GitHub Release, put the Repo URL (e.g., OatmealDome/dolphin-ios). If Another Repo, put the JSON URL (e.g., https://repo.ballermc.com/repo.json).
    validations:
      required: true

  - type: input
    id: external_app_name
    attributes:
      label: External App Name (Only for 'Another Repo JSON' option)
      description: If syncing from another repo, what is the exact name of the app in THEIR json? (e.g., YTLite). Leave empty if not applicable.
    validations:
      required: false
