name: 🚀 Add New App to Repo
description: Smart dashboard to automatically fetch apps using multiple advanced methods.
title: "[ADD APP] "
labels: ["auto-add"]
body:
  - type: dropdown
    id: source_type
    attributes:
      label: Source Type (How should the bot fetch the app?)
      description: Choose your fetching method.
      options:
        - "External Repo: Fetch Specific App by Name"
        - "External Repo: Fetch ONLY the Latest Updated App"
        - "External Repo: Fetch ALL Apps"
        - "GitHub Release (Standard App)"
    validations:
      required: true

  - type: input
    id: source_url
    attributes:
      label: Source URL
      description: URL to the Repo JSON (e.g., https://repo.ballermc.com/repo.json) OR GitHub Repo (e.g., LiveContainer/LiveContainer)
    validations:
      required: true

  - type: input
    id: external_app_name
    attributes:
      label: Target App Name (Only for 'Fetch Specific App')
      description: If you chose "Fetch Specific App", write its exact name here. Leave blank for other options.
    validations:
      required: false

  - type: input
    id: app_name
    attributes:
      label: Local App Name (Optional)
      description: If adding a specific app or GitHub release, you can rename it here. If left blank, the bot uses the original name.
    validations:
      required: false

  - type: textarea
    id: icon_upload
    attributes:
      label: App Icon (Optional)
      description: Drag and drop an icon here. If fetching from an external repo and left blank, the bot will use their original icon.
    validations:
      required: false

  - type: markdown
    attributes:
      value: "--- \n **👇 OPTIONAL DETAILS (Fill these ONLY if using 'GitHub Release')**"

  - type: input
    id: bundle_id
    attributes:
      label: Bundle Identifier
    validations:
      required: false

  - type: input
    id: developer
    attributes:
      label: Developer Name
    validations:
      required: false

  - type: input
    id: description
    attributes:
      label: Description
    validations:
      required: false

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - utilities
        - games
        - emulators
        - entertainment
        - social
    validations:
      required: false
