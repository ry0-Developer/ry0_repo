name: Update ARMSX2 (Nightly)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update repo.json
        env:
          TARGET_REPO: "ARMSX2/ARMSX2"
          APP_NAME: "ARMSX2 (Nightly)"
        run: |
          RELEASE_JSON=$(curl -sL "https://api.github.com/repos/$TARGET_REPO/releases" | jq -c '[.[] | select(.prerelease == true)] | .[0]')
          VERSION=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
          IPA_ASSET=$(echo "$RELEASE_JSON" | jq -c '.assets[] | select(.name | ascii_downcase | endswith(".ipa"))' | head -n 1)
          DOWNLOAD_URL=$(echo "$IPA_ASSET" | jq -r '.browser_download_url')
          FILESIZE=$(echo "$IPA_ASSET" | jq -r '.size')
          DATE=$(echo "$IPA_ASSET" | jq -r '.updated_at')
          CLEAN_VERSION="Nightly-$(date -d "$DATE" +'%Y.%m.%d')"
          
          jq --arg app "$APP_NAME" --arg v "$CLEAN_VERSION" --arg u "$DOWNLOAD_URL" --arg d "$DATE" --argjson s "$FILESIZE" \
          '(.apps[] | select(.name == $app)).versions[0] |= . + {version: $v, date: $d, downloadURL: $u, size: $s}' repo.json > tmp.json && mv tmp.json repo.json
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git commit -m "🚀 Auto-Updated $APP_NAME" || echo "No changes to commit"
          git push
