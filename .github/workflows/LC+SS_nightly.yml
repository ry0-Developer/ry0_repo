name: Update LC+SS_nightly

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Direct Link and Update repo.json
        env:
          TARGET_REPO: "LiveContainer/LiveContainer"
          APP_NAME: "LiveContainer + SideStore (Nightly)"
        run: |
          echo "🔍 Searching for nightly release in $TARGET_REPO..."
          
          # محاولة جلب التحديث بالاعتماد على تاغ nightly
          RELEASE_JSON=$(curl -sL "https://api.github.com/repos/$TARGET_REPO/releases/tags/nightly")
          VERSION=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
          
          # إذا لم يوجد تاغ اسمه nightly، نجلب أحدث إصدار Pre-release
          if [ "$VERSION" == "null" ] || [ -z "$VERSION" ]; then
            RELEASE_JSON=$(curl -sL "https://api.github.com/repos/$TARGET_REPO/releases" | jq -c '[.[] | select(.prerelease == true)] | .[0]')
            VERSION=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
          fi

          if [ "$VERSION" == "null" ] || [ -z "$VERSION" ]; then
            echo "❌ No nightly release found."
            exit 1
          fi
          
          # البحث الحصري عن النسخة المدمجة مع SideStore فقط
          IPA_ASSET=$(echo "$RELEASE_JSON" | jq -c '.assets[] | select(.name | ascii_downcase | contains("sidestore") and endswith(".ipa"))' | head -n 1)
          
          if [ -z "$IPA_ASSET" ]; then
            echo "❌ No SideStore bundled IPA found in the nightly release. Skipping..."
            exit 1
          fi
          
          DOWNLOAD_URL=$(echo "$IPA_ASSET" | jq -r '.browser_download_url')
          FILESIZE=$(echo "$IPA_ASSET" | jq -r '.size')
          DATE=$(echo "$IPA_ASSET" | jq -r '.updated_at')
          
          # تجميل رقم الإصدار ليكون منظم (مثال: Nightly-2026.08.15)
          CLEAN_VERSION="Nightly-$(date -d "$DATE" +'%Y.%m.%d')"
          
          echo "✅ Found Direct Link: $DOWNLOAD_URL"
          echo "🚀 Updating $APP_NAME to version $CLEAN_VERSION"
          
          # تحديث المتجر
          jq --arg app "$APP_NAME" --arg v "$CLEAN_VERSION" --arg u "$DOWNLOAD_URL" --arg d "$DATE" --argjson s "$FILESIZE" \
          '(.apps[] | select(.name == $app)).versions[0] |= . + {version: $v, date: $d, downloadURL: $u, size: $s}' repo.json > tmp.json && mv tmp.json repo.json
          
          # الحفظ
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git commit -m "🚀 Auto-Updated LiveContainer (Nightly) (Direct Link)" || echo "No changes to commit"
          git push
