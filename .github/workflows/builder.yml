name: App Builder Bot

on:
  workflow_dispatch:
    inputs:
      source_type:
        description: 'Source Type (How to fetch)'
        required: true
        default: 'External Repo: Fetch ONLY the Latest Updated App'
        type: choice
        options:
          - 'External Repo: Fetch Specific App by Name'
          - 'External Repo: Fetch ONLY the Latest Updated App'
          - 'External Repo: Fetch ALL Apps'
          - 'GitHub Release (Standard App)'
      source_url:
        description: 'Source URL (JSON Repo or GitHub Repo)'
        required: true
        default: 'https://repo.ballermc.com/repo.json'
      external_app_name:
        description: 'Target App Name (If Specific App)'
        required: false
      local_name_input:
        description: 'Local App Name (Optional override)'
        required: false

permissions:
  contents: write
  issues: write

jobs:
  build-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Process Inputs and Build Repo
        env:
          INPUT_SOURCE_TYPE: ${{ github.event.inputs.source_type }}
          INPUT_SOURCE_URL: ${{ github.event.inputs.source_url }}
          INPUT_EXT_NAME: ${{ github.event.inputs.external_app_name }}
          INPUT_LOCAL_NAME: ${{ github.event.inputs.local_name_input }}
          REPO_NAME: ${{ github.repository }}
        run: |
          cat << 'EOF' > builder.py
          import os, re, json, requests

          source_type = os.environ.get('INPUT_SOURCE_TYPE', '')
          source_url = os.environ.get('INPUT_SOURCE_URL', '')
          external_name = os.environ.get('INPUT_EXT_NAME', '')
          local_name_input = os.environ.get('INPUT_LOCAL_NAME', '')
          repo_name = os.environ.get('REPO_NAME', '')

          apps_to_add = []
          
          if "External Repo" in source_type:
              req = requests.get(source_url)
              ext_data = req.json()
              ext_apps = ext_data.get('apps', [])
              
              if "Specific App" in source_type:
                  app = next((a for a in ext_apps if a['name'].lower() == (external_name or '').lower()), None)
                  if app:
                      if local_name_input: app['name'] = local_name_input
                      apps_to_add.append(app)
                  else:
                      print(f"Error: {external_name} not found.")
                      exit(1)
                      
              elif "Latest Updated App" in source_type:
                  def get_date(app):
                      try:
                          return app.get('versions', [{}])[0].get('date', '1970-01-01T00:00:00Z')
                      except:
                          return '1970-01-01T00:00:00Z'
                  ext_apps.sort(key=get_date, reverse=True)
                  apps_to_add.append(ext_apps[0])
                  
              elif "ALL Apps" in source_type:
                  apps_to_add = ext_apps
          else:
              apps_to_add.append({
                  "name": local_name_input or "New App",
                  "bundleIdentifier": "com.custom.app",
                  "developerName": "Unknown",
                  "localizedDescription": "Added via Dashboard",
                  "category": "utilities",
                  "versions": [{"version": "1.0", "date": "2026-08-14T00:00:00Z", "downloadURL": "TBD", "size": 0}]
              })

          with open('repo.json', 'r') as f:
              repo_data = json.load(f)

          os.makedirs('.github/workflows', exist_ok=True)
          os.makedirs('icons', exist_ok=True)

          for app in apps_to_add:
              app_name = app['name']
              safe_name = re.sub(r'[^a-zA-Z0-9]', '', app_name).lower()
              
              repo_data['apps'] = [a for a in repo_data['apps'] if a['name'] != app_name]
              repo_data['apps'].append(app)
              
              wf_path = f".github/workflows/sync_{safe_name}.yml"
              if "External Repo" in source_type:
                  ext_target = app_name if "ALL Apps" in source_type or "Latest" in source_type else external_name
                  # تم إضافة جدول زمني schedule عشان يشتغل يومياً تلقائياً زي باقي تطبيقاتك
                  workflow_content = f"""name: Update {app_name}
          on:
            workflow_dispatch:
            schedule:
              - cron: '0 0 * * *'

          jobs:
            sync:
              runs-on: ubuntu-latest
              permissions:
                contents: write
              steps:
                - uses: actions/checkout@v4
                - name: Sync App
                  run: |
                    curl -s "{source_url}" > ext.json
                    VERSION=$(jq -r '.apps[] | select(.name == "{ext_target}") | .versions[0].version' ext.json)
                    URL=$(jq -r '.apps[] | select(.name == "{ext_target}") | .versions[0].downloadURL' ext.json)
                    SIZE=$(jq -r '.apps[] | select(.name == "{ext_target}") | .versions[0].size' ext.json)
                    DATE=$(jq -r '.apps[] | select(.name == "{ext_target}") | .versions[0].date' ext.json)
                    
                    if [ "$VERSION" != "null" ]; then
                      jq --arg app "{app_name}" --arg v "$VERSION" --arg u "$URL" --arg d "$DATE" --argjson s "$SIZE" \\
                      '(.apps[] | select(.name == $app)).versions[0] |= . + {{version: $v, date: $d, downloadURL: $u, size: $s}}' repo.json > tmp.json && mv tmp.json repo.json
                      git config user.name "github-actions[bot]"
                      git config user.email "github-actions[bot]@users.noreply.github.com"
                      git add repo.json
                      git commit -m "Auto-sync {app_name} to $VERSION" || echo "No changes"
                      git push
                    fi
          """
                  with open(wf_path, 'w') as f:
                      f.write(workflow_content)

          with open('repo.json', 'w') as f:
              json.dump(repo_data, f, indent=2)
          EOF
          python builder.py

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo.json icons/ .github/workflows/
          git commit -m "🤖 Dashboard: Added apps with daily schedule" || echo "No changes"
          git push
