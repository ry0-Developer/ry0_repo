name: Update LiveContainer + SideStore (Stable)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Direct Link and Update repo.json
        env:
          TARGET_REPO: "LiveContainer/LiveContainer"
          APP_NAME: "LiveContainer+ SideStore (Stable)"
        run: |
          echo "🔍 Searching for latest stable release in $TARGET_REPO..."
          
          # جلب أحدث إصدار مستقر
          RELEASE_JSON=$(curl -sL "https://api.github.com/repos/$TARGET_REPO/releases/latest")
          VERSION=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
          
          if [ "$VERSION" == "null" ] || [ -z "$VERSION" ]; then
            echo "❌ No stable release found."
            exit 1
          fi
          
          # البحث الحصري عن النسخة المدمجة مع SideStore فقط
          IPA_ASSET=$(echo "$RELEASE_JSON" | jq -c '.assets[] | select(.name | ascii_downcase | contains("sidestore") and endswith(".ipa"))' | head -n 1)
          
          if [ -z "$IPA_ASSET" ]; then
            echo "❌ No SideStore bundled IPA found in the latest release. Skipping..."
            exit 1
          fi
          
          DOWNLOAD_URL=$(echo "$IPA_ASSET" | jq -r '.browser_download_url')
          FILESIZE=$(echo "$IPA_ASSET" | jq -r '.size')
          DATE=$(echo "$RELEASE_JSON" | jq -r '.published_at')
          
          echo "✅ Found Direct Link: $DOWNLOAD_URL"
          echo "🚀 Updating $APP_NAME to version $VERSION"
          
          # تحديث المتجر
          jq --arg app "$APP_NAME" --arg v "$VERSION" --arg u "$DOWNLOAD_URL" --arg d "$DATE" --argjson s "$FILESIZE" \
          '(.apps[] | select(.name == $app)).versions[0] |= . + {version: $v, date: $d, downloadURL: $u, size: $s}' repo.json > tmp.json && mv tmp.json repo.json
          
          # الحفظ
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git commit -m "🚀 Auto-Updated LiveContainer (Stable) to $VERSION (Direct Link)" || echo "No changes to commit"
          git push
