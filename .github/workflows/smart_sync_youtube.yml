name: Smart Sync YouTube & YT Music

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smart-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests cloudscraper

      - name: Fetch & Select Latest Builds
        run: |
          cat << 'EOF' > smart_sync.py
          import json, cloudscraper
          from datetime import datetime

          SOURCE_URL = 'https://repo.ballermc.com/repo.json'

          print("🚀 Firing up Cloudscraper to fetch upstream...")
          scraper = cloudscraper.create_scraper(browser={'browser': 'chrome', 'platform': 'windows', 'mobile': False})
          try:
              resp = scraper.get(SOURCE_URL, timeout=30)
              resp.raise_for_status()
              ext_data = resp.json()
              print("✅ Successfully fetched source repo!")
          except Exception as e:
              print(f"Error fetching upstream repository: {e}")
              exit(1)

          ext_apps = ext_data.get('apps', [])

          def get_app_date(app):
              try:
                  date_str = app.get('versions', [{}])[0].get('date', '1970-01-01T00:00:00Z')
                  return datetime.fromisoformat(date_str.replace('Z', '+00:00'))
              except Exception:
                  return datetime.min

          yt_music_candidates = []
          yt_main_candidates = []

          for app in ext_apps:
              name = app.get('name', '').lower()
              bundle = app.get('bundleIdentifier', '').lower()

              if 'music' in name or 'music' in bundle:
                  yt_music_candidates.append(app)
              elif 'youtube' in name or 'yt' in name or 'google.ios.youtube' in bundle:
                  yt_main_candidates.append(app)

          best_yt_music = max(yt_music_candidates, key=get_app_date) if yt_music_candidates else None
          best_yt_main = max(yt_main_candidates, key=get_app_date) if yt_main_candidates else None

          with open('repo.json', 'r') as f:
              repo_data = json.load(f)

          local_apps = repo_data.get('apps', [])

          def update_or_replace_app(new_app, is_music=False):
              global local_apps # 🛠️ تم حل الخطأ هنا (استخدام global بدل nonlocal)
              if not new_app:
                  return

              new_app['category'] = 'entertainment'
              if 'appPermissions' in new_app and not new_app['appPermissions']:
                  del new_app['appPermissions']

              def is_match(a):
                  a_name = a.get('name', '').lower()
                  a_bundle = a.get('bundleIdentifier', '').lower()
                  if is_music:
                      return 'music' in a_name or 'music' in a_bundle
                  else:
                      return ('youtube' in a_name or 'yt' in a_name) and ('music' not in a_name and 'music' not in a_bundle)

              local_apps = [a for a in local_apps if not is_match(a)]
              local_apps.append(new_app)

          if best_yt_main:
              print(f"🎯 Selected Latest YouTube: {best_yt_main['name']} (Version: {best_yt_main['versions'][0]['version']})")
              update_or_replace_app(best_yt_main, is_music=False)

          if best_yt_music:
              print(f"🎵 Selected Latest YouTube Music: {best_yt_music['name']} (Version: {best_yt_music['versions'][0]['version']})")
              update_or_replace_app(best_yt_music, is_music=True)

          repo_data['apps'] = local_apps

          with open('repo.json', 'w') as f:
              json.dump(repo_data, f, indent=2)
          EOF
          python smart_sync.py

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git commit -m "🤖 Smart Auto-Sync: Picked latest YouTube & YT Music builds" || echo "No changes detected"
          git push
