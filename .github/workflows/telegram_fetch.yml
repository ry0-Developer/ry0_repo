name: Auto Telegram IPA Fetcher

on:
  schedule:
    - cron: '0 3 * * *' # يشتغل يومياً الساعة 3 الفجر بتوقيت جرينتش
  workflow_dispatch:
    inputs:
      channel_username:
        description: 'Telegram Channel Username (e.g., tubevault)'
        required: true
        default: 'tubevault'
      app_name:
        description: 'App Name exactly as in repo.json'
        required: true
        default: 'YTPlusM (1.4.2)'

permissions:
  contents: write

jobs:
  smart-fetch-telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install telethon cryptg

      - name: Fetch and Check for Updates
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel_username }}
          INPUT_APP: ${{ github.event.inputs.app_name }}
        run: |
          # تحديد القيم الافتراضية إذا اشتغل تلقائي (Cron) بدون تدخل منك
          CHANNEL=${INPUT_CHANNEL:-"tubevault"}
          APP_NAME=${INPUT_APP:-"YTPlusM (1.4.2)"}
          
          echo "Channel: $CHANNEL | App: $APP_NAME"

          cat << 'EOF' > fetch_tg.py
          import os, asyncio, json
          from datetime import datetime, timezone
          from telethon.sync import TelegramClient
          from telethon.sessions import StringSession

          api_id = int(os.environ.get('TG_API_ID'))
          api_hash = os.environ.get('TG_API_HASH')
          session_str = os.environ.get('TG_SESSION')
          channel = os.environ.get('CHANNEL')
          app_name = os.environ.get('APP_NAME')

          async def main():
              # 1. جلب تاريخ التطبيق الحالي من ملف repo.json
              current_date = ""
              try:
                  with open('repo.json', 'r') as f:
                      repo_data = json.load(f)
                      for app in repo_data.get('apps', []):
                          if app.get('name') == app_name:
                              current_date = app.get('versions', [{}])[0].get('date', "")
                              break
              except Exception as e:
                  print("Could not read repo.json correctly.")

              # 2. الاتصال بتيليجرام
              client = TelegramClient(StringSession(session_str), api_id, api_hash)
              await client.connect()
              print(f"🔍 Searching @{channel} for {app_name}...")
              
              messages = await client.get_messages(channel, limit=20)
              downloaded_file = None
              msg_date_str = ""
              
              for msg in messages:
                  if msg.document and msg.file.name and msg.file.name.lower().endswith('.ipa'):
                      # تحويل تاريخ الرسالة لصيغة متوافقة مع متجرك
                      msg_date = msg.date.astimezone(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
                      
                      # 3. المقارنة: هل التحديث جديد؟
                      if msg_date == current_date:
                          print("🛑 التطبيق اللي في القناة هو نفس اللي عندك بالمتجر.. ما فيه تحديث جديد!")
                          await client.disconnect()
                          exit(0) # الخروج بدون أخطاء وبدون تحميل
                      
                      print(f"🚀 تحديث جديد نزل! جاري تحميل: {msg.file.name}...")
                      downloaded_file = await client.download_media(msg, file=msg.file.name)
                      msg_date_str = msg_date
                      break
              
              await client.disconnect()
              
              if downloaded_file:
                  with open('file_info.env', 'w') as f:
                      f.write(f"IPA_FILE={downloaded_file}\n")
                      f.write(f"NEW_DATE={msg_date_str}\n")
              else:
                  print("❌ ما لقيت أي ملف IPA في آخر الرسائل.")
                  exit(1)

          asyncio.run(main())
          EOF
          
          # تصدير المتغيرات لسكربت البايثون
          export CHANNEL APP_NAME
          python fetch_tg.py

      - name: Upload to GitHub Releases
        # هذي الخطوة ما راح تشتغل إلا إذا البايثون لقى تحديث جديد
        if: success() && hashFiles('file_info.env') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source file_info.env
          echo "Uploading $IPA_FILE..."
          gh release upload nightly "$IPA_FILE" --clobber || gh release create nightly "$IPA_FILE" --clobber

      - name: Update repo.json
        if: success() && hashFiles('file_info.env') != ''
        env:
          INPUT_APP: ${{ github.event.inputs.app_name }}
          REPO_NAME: ${{ github.repository }}
        run: |
          APP_NAME=${INPUT_APP:-"YTPlusM (1.4.2)"}
          source file_info.env
          FILESIZE=$(stat -c%s "$IPA_FILE")
          SAFE_FILENAME=$(basename "$IPA_FILE" | tr ' ' '.')
          URL="https://github.com/$REPO_NAME/releases/download/nightly/$SAFE_FILENAME"
          
          # استخدام تاريخ رسالة تيليجرام كإصدار للتطبيق
          VERSION=$(date -d "${NEW_DATE}" +"%Y.%m.%d")
          
          jq --arg app "$APP_NAME" --arg v "$VERSION" --arg u "$URL" --arg d "$NEW_DATE" --argjson s "$FILESIZE" \
          '(.apps[] | select(.name == $app)).versions[0] |= . + {version: $v, date: $d, downloadURL: $u, size: $s}' repo.json > tmp.json && mv tmp.json repo.json
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git commit -m "🚀 Auto-Updated $APP_NAME from Telegram"
          git push
