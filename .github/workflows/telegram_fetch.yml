name: Cloudflare R2 IPA Fetcher

on:
  workflow_dispatch:
    inputs:
      channel_username:
        description: 'Telegram Channel Username'
        required: true
        default: 'm_ipa_real'
      app_name:
        description: 'App Name in repo.json'
        required: true
        default: 'Minecraft'

permissions:
  contents: write

jobs:
  fetch-and-upload-r2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install telethon cryptg

      - name: Fetch IPA from Telegram
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          CHANNEL: ${{ github.event.inputs.channel_username }}
        run: |
          cat << 'EOF' > fetch_tg.py
          import os, asyncio, re
          from datetime import timezone
          from telethon.sync import TelegramClient
          from telethon.sessions import StringSession

          api_id = int(os.environ.get('TG_API_ID'))
          api_hash = os.environ.get('TG_API_HASH')
          session_str = os.environ.get('TG_SESSION')
          channel = os.environ.get('CHANNEL')

          async def main():
              client = TelegramClient(StringSession(session_str), api_id, api_hash)
              await client.connect()
              print(f"🔍 Searching @{channel} for latest IPA...")
              
              messages = await client.get_messages(channel, limit=20)
              downloaded_file = None
              msg_date_str = ""
              
              for msg in messages:
                  if msg.document and msg.file.name and msg.file.name.lower().endswith('.ipa'):
                      msg_date_str = msg.date.astimezone(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
                      print(f"📥 Found: {msg.file.name}. Downloading...")
                      downloaded_file = await client.download_media(msg, file=msg.file.name)
                      break
              
              await client.disconnect()
              
              if downloaded_file:
                  # تنظيف اسم الملف بالكامل من أي رموز غريبة أو مسافات لتجنب أي أخطاء
                  clean_name = re.sub(r'[^A-Za-z0-9_.-]', '_', os.path.basename(downloaded_file))
                  os.rename(downloaded_file, clean_name)
                  
                  # استخدام الطريقة الرسمية والآمنة لحفظ المتغيرات في GitHub
                  env_file = os.environ.get('GITHUB_ENV')
                  with open(env_file, 'a') as f:
                      f.write(f"IPA_FILE={clean_name}\n")
                      f.write(f"NEW_DATE={msg_date_str}\n")
              else:
                  print("❌ No IPA found.")
                  exit(1)

          asyncio.run(main())
          EOF
          python fetch_tg.py

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          echo "Uploading $IPA_FILE to Cloudflare R2..."
          aws s3 cp "$IPA_FILE" "s3://$R2_BUCKET/$IPA_FILE" --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"

      - name: Update repo.json
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          FILESIZE=$(stat -c%s "$IPA_FILE")
          
          # تجهيز الرابط المباشر
          DIRECT_URL="${R2_PUBLIC_URL}/${IPA_FILE}"
          VERSION=$(date -d "${NEW_DATE}" +"%Y.%m.%d")
          
          echo "Direct Link: $DIRECT_URL"
          
          jq --arg app "$APP_NAME" --arg v "$VERSION" --arg u "$DIRECT_URL" --arg d "$NEW_DATE" --argjson s "$FILESIZE" \
          '(.apps[] | select(.name == $app)).versions[0] |= . + {version: $v, date: $d, downloadURL: $u, size: $s}' repo.json > tmp.json && mv tmp.json repo.json
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git commit -m "🚀 Auto-Updated $APP_NAME (Hosted on Cloudflare R2)"
          git push
